# Local development dependencies. Phase 0 needs Postgres only.
name: film-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: film
      POSTGRES_PASSWORD: film
      POSTGRES_DB: film
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U film -d film']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
